services:
  tapo-control-bridge:
    image: ghcr.io/maxhugit/tapo-control-bridge:latest
    container_name: tapo-control-bridge
    restart: unless-stopped
    ports:
      - "192.168.100.218:18080:8080"
    environment:
      CONFIG_FILE: /config/config.json
    volumes:
      - ./config.json:/config/config.json:ro
