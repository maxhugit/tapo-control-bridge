services:
  tapo-control-bridge:
    image: ghcr.io/maxhugit/tapo-control-bridge:latest
    container_name: tapo-control-bridge
    restart: unless-stopped
    ports:
      - "192.168.100.218:18080:8080"
    environment:
      API_TOKEN: "replace-with-a-long-random-token"
      CAMERAS_CONFIG_FILE: /config/config.xml
    volumes:
      - ./config.xml:/config/config.xml:ro
